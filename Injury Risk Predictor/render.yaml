# Render Blueprint - deploys both API and frontend
# https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: yara-sports-api
    runtime: python
    region: oregon
    plan: free
    rootDir: Injury Risk Predictor
    buildCommand: pip install --no-cache-dir -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REFRESH_CRON_TOKEN
        sync: false
      # Narrative LLM. Without these, Yara serves deterministic template text
      # (no analysis, no news/fixture discussion). Club leagues run on the
      # cheaper model; World Cup narratives route to GPT-5.5 via the scoped
      # INTL override. OPENAI_API_KEY is a dashboard secret (never committed).
      - key: NARRATIVE_LLM_PROVIDER
        value: openai_compatible
      - key: INTL_NARRATIVE_LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # gpt-5.4 for WC (full gpt-5.5 reasoning was too slow and timed out).
      # reasoning_effort=low keeps latency ~2.3s, so the flagship fits the cap.
      - key: INTL_OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: NARRATIVE_LLM_TEMPERATURE
        value: "0.7"
      - key: NARRATIVE_LLM_TIMEOUT_SECONDS
        value: "45"
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health

  # Next.js Frontend
  - type: web
    name: yara-sports-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: Injury Risk Predictor/frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Reduce Next.js webpack build OOM on small Render builders
      - key: NODE_OPTIONS
        value: "--max-old-space-size=4096"
      - key: NEXT_PUBLIC_API_URL
        value: "https://yara-sports-api.onrender.com"

  # Scheduled predictions refresh (runs separately; +$1/mo minimum billing)
  - type: cron
    name: yara-predictions-refresh
    runtime: python
    region: oregon
    plan: starter
    rootDir: Injury Risk Predictor
    schedule: "0 */12 * * *"
    buildCommand: pip install --no-cache-dir -r api/requirements.txt
    startCommand: python scripts/trigger_refresh.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REFRESH_TRIGGER_URL
        value: "https://yara-sports-api.onrender.com/api/admin/refresh-predictions"
      - key: REFRESH_MODE
        value: "api"
      - key: REFRESH_TARGET
        value: "club"
      - key: REFRESH_CRON_TOKEN
        sync: false

  # World Cup 2026 refresh — squads/fixtures/caps change slowly, so daily is enough.
  - type: cron
    name: yara-wc-refresh
    runtime: python
    region: oregon
    plan: starter
    rootDir: Injury Risk Predictor
    schedule: "30 4 * * *"
    buildCommand: pip install --no-cache-dir -r api/requirements.txt
    startCommand: python scripts/trigger_refresh.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REFRESH_TRIGGER_URL
        value: "https://yara-sports-api.onrender.com/api/admin/refresh-predictions"
      - key: REFRESH_MODE
        value: "api"
      - key: REFRESH_TARGET
        value: "international"
      - key: REFRESH_CRON_TOKEN
        sync: false
